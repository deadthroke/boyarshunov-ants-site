<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="doom-green" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="40%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </radialGradient>
    <radialGradient id="titanium" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Moss Hood -->
  <path d="M50 4 C24 4, 12 28, 14 62 C16 84, 30 96, 50 96 C70 96, 84 84, 86 62 C88 28, 76 4, 50 4 Z" fill="url(#doom-green)" stroke="#166534" stroke-width="2"/>
  <!-- Hood folds -->
  <path d="M22 45 C35 22, 65 22, 78 45" fill="none" stroke="#052e16" stroke-width="3" stroke-linecap="round"/>
  <!-- Ant Antennae protruding through hood -->
  <path d="M38 18 C30 6, 18 10, 12 16" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="12" cy="16" r="3" fill="#4ade80" filter="url(#neon-glow)"/>
  <path d="M62 18 C70 6, 82 10, 88 16" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="88" cy="16" r="3" fill="#4ade80" filter="url(#neon-glow)"/>
  <!-- Titanium Mask Faceplate -->
  <path d="M26 38 C26 32, 74 32, 74 38 C76 60, 68 84, 50 88 C32 84, 24 60, 26 38 Z" fill="url(#titanium)" stroke="#0f172a" stroke-width="2"/>
  <!-- Rivets -->
  <circle cx="30" cy="40" r="1.5" fill="#cbd5e1"/>
  <circle cx="70" cy="40" r="1.5" fill="#cbd5e1"/>
  <circle cx="28" cy="62" r="1.5" fill="#cbd5e1"/>
  <circle cx="72" cy="62" r="1.5" fill="#cbd5e1"/>
  <!-- Glowing Emerald Compound Eyes / Eye Slits -->
  <polygon points="32,46 45,49 43,55 30,52" fill="#22c55e" filter="url(#neon-glow)"/>
  <polygon points="68,46 55,49 57,55 70,52" fill="#22c55e" filter="url(#neon-glow)"/>
  <!-- Doom Iron Mandibles / Grille -->
  <path d="M42 62 L58 62 L55 78 L45 78 Z" fill="#0f172a"/>
  <line x1="44" y1="66" x2="56" y2="66" stroke="#475569" stroke-width="1.5"/>
  <line x1="45" y1="70" x2="55" y2="70" stroke="#475569" stroke-width="1.5"/>
  <line x1="46" y1="74" x2="54" y2="74" stroke="#475569" stroke-width="1.5"/>
  <!-- Sharp Titanium Mandible tusks -->
  <path d="M35 70 C37 84, 46 88, 48 84 C43 80, 40 74, 35 70 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="1"/>
  <path d="M65 70 C63 84, 54 88, 52 84 C57 80, 60 74, 65 70 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="1"/>
</svg>

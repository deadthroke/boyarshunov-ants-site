<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="crystal-face-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="crystal-face-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="crystal-face-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="sugar-sparkle">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Glow aura -->
  <circle cx="50" cy="50" r="38" fill="rgba(56, 189, 248, 0.25)" filter="url(#sugar-sparkle)"/>
  
  <!-- Isometric Sugar Cube -->
  <!-- Top Face -->
  <polygon points="50,15 82,32 50,49 18,32" fill="url(#crystal-face-1)" stroke="#e0f2fe" stroke-width="1.5"/>
  <!-- Left Face -->
  <polygon points="18,32 50,49 50,85 18,68" fill="url(#crystal-face-3)" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Right Face -->
  <polygon points="50,49 82,32 82,68 50,85" fill="url(#crystal-face-2)" stroke="#0284c7" stroke-width="1.5"/>

  <!-- Facet sparkles -->
  <polygon points="50,40 52,43 55,44 52,45 50,48 48,45 45,44 48,43" fill="#ffffff" filter="url(#sugar-sparkle)"/>
  <polygon points="32,25 34,27 37,28 34,29 32,32 30,29 27,28 30,27" fill="#ffffff"/>
  <polygon points="68,60 70,62 73,63 70,64 68,67 66,64 63,63 66,62" fill="#ffffff"/>
  
  <!-- Micro sweetness aura rings -->
  <ellipse cx="50" cy="52" rx="44" ry="24" fill="none" stroke="#fbcfe8" stroke-width="1.5" stroke-dasharray="3 4"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Bottle Cap Shield -->
  <defs>
    <radialGradient id="metal-sheen" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff7b7b"/>
      <stop offset="50%" stop-color="#d61f1f"/>
      <stop offset="100%" stop-color="#7a0808"/>
    </radialGradient>
    <radialGradient id="silver-sheen" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#b0b8c4"/>
      <stop offset="100%" stop-color="#646b77"/>
    </radialGradient>
    <radialGradient id="blue-sheen" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#4ba3ff"/>
      <stop offset="60%" stop-color="#0a58ca"/>
      <stop offset="100%" stop-color="#042c69"/>
    </radialGradient>
  </defs>
  <!-- Bottle cap serrations / crimps -->
  <path d="M50 2 
    L54 6 L59 3 L63 8 L68 6 L71 12 L77 11 L79 17 L85 18 L86 24 L91 26 L91 33 L96 36 L94 42 L98 47 L95 53 L98 58 L94 64 L96 69 L91 73 L91 79 L86 82 L84 88 L78 89 L76 95 L70 94 L66 99 L61 97 L56 100 L50 97 L44 100 L39 97 L34 99 L30 94 L24 95 L22 89 L16 88 L14 82 L9 79 L9 73 L4 69 L6 64 L2 58 L5 53 L2 47 L6 42 L4 36 L9 33 L9 26 L14 24 L15 18 L21 17 L23 11 L29 12 L32 6 L37 8 L41 3 L46 6 Z" 
    fill="#8b0000" stroke="#ffd700" stroke-width="1.5"/>
  <!-- Outer red ring -->
  <circle cx="50" cy="50" r="42" fill="url(#metal-sheen)" stroke="#ffd700" stroke-width="1"/>
  <!-- Silver ring -->
  <circle cx="50" cy="50" r="33" fill="url(#silver-sheen)"/>
  <!-- Inner red ring -->
  <circle cx="50" cy="50" r="24" fill="url(#metal-sheen)"/>
  <!-- Blue center circle -->
  <circle cx="50" cy="50" r="15" fill="url(#blue-sheen)"/>
  <!-- Ant Star -->
  <polygon points="50,38 53,46 62,46 55,51 58,60 50,54 42,60 45,51 38,46 47,46" fill="#ffffff" filter="drop-shadow(0 0 2px rgba(255,255,255,0.8))"/>
  <!-- Miniature Ant antennae on shield -->
  <path d="M47 38 Q42 32 37 34" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M53 38 Q58 32 63 34" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none"/>
</svg>

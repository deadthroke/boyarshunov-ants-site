<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="arc-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>
    <filter id="cyan-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Gold/Bronze Chitin Housing -->
  <circle cx="50" cy="50" r="46" fill="#1e293b" stroke="#eab308" stroke-width="4"/>
  <circle cx="50" cy="50" r="40" fill="#0f172a" stroke="#ca8a04" stroke-width="2"/>
  <!-- Coils -->
  <g stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round">
    <line x1="50" y1="12" x2="50" y2="20"/>
    <line x1="77" y1="23" x2="71" y2="29"/>
    <line x1="88" y1="50" x2="80" y2="50"/>
    <line x1="77" y1="77" x2="71" y2="71"/>
    <line x1="50" y1="88" x2="50" y2="80"/>
    <line x1="23" y1="77" x2="29" y2="71"/>
    <line x1="12" y1="50" x2="20" y2="50"/>
    <line x1="23" y1="23" x2="29" y2="29"/>
  </g>
  <!-- Inner Bioluminescent Core -->
  <circle cx="50" cy="50" r="28" fill="url(#arc-glow)" filter="url(#cyan-glow)"/>
  <!-- Center Triangle (Micro-Reactor) -->
  <polygon points="50,32 66,59 34,59" fill="none" stroke="#ffffff" stroke-width="3" filter="url(#cyan-glow)"/>
  <circle cx="50" cy="50" r="6" fill="#ffffff"/>
</svg>

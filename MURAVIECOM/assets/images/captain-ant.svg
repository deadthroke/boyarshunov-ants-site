<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <radialGradient id="cap-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#1d4ed8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cap-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="40%" stop-color="#1d4ed8"/>
      <stop offset="85%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shield-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="leather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="star-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="200" cy="220" r="180" fill="url(#cap-glow)"/>

  <!-- Ant Abdomen (Back section) -->
  <ellipse cx="200" cy="340" rx="50" ry="65" fill="url(#cap-blue)" stroke="#0f172a" stroke-width="3"/>
  <!-- Red and white vertical stripes on abdomen (Captain America motif) -->
  <path d="M175 300 L175 380" stroke="#ffffff" stroke-width="6"/>
  <path d="M190 295 L190 395" stroke="#ef4444" stroke-width="6"/>
  <path d="M200 295 L200 398" stroke="#ffffff" stroke-width="6"/>
  <path d="M210 295 L210 395" stroke="#ef4444" stroke-width="6"/>
  <path d="M225 300 L225 380" stroke="#ffffff" stroke-width="6"/>
  <!-- Brown Utility Belt with Pouches -->
  <rect x="150" y="290" width="100" height="14" rx="3" fill="url(#leather)" stroke="#271003" stroke-width="2"/>
  <rect x="165" y="287" width="14" height="18" rx="2" fill="#d97706"/>
  <rect x="190" y="287" width="20" height="18" rx="2" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="220" y="287" width="14" height="18" rx="2" fill="#d97706"/>

  <!-- Legs Behind -->
  <!-- Back Legs -->
  <path d="M150 310 L90 360 L80 420" fill="none" stroke="url(#cap-blue)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M250 310 L310 360 L320 420" fill="none" stroke="url(#cap-blue)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Brown combat boots / foot pads -->
  <circle cx="80" cy="420" r="7" fill="url(#leather)"/>
  <circle cx="320" cy="420" r="7" fill="url(#leather)"/>

  <!-- Mid Legs -->
  <path d="M140 240 L70 250 L55 300" fill="none" stroke="url(#cap-blue)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M260 240 L330 250 L345 300" fill="none" stroke="url(#cap-blue)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Ant Thorax (Chest) -->
  <ellipse cx="200" cy="230" rx="48" ry="52" fill="url(#cap-blue)" stroke="#0f172a" stroke-width="3"/>

  <!-- Leather Harness Straps over Thorax -->
  <line x1="165" y1="185" x2="210" y2="280" stroke="url(#leather)" stroke-width="6"/>
  <line x1="235" y1="185" x2="190" y2="280" stroke="url(#leather)" stroke-width="6"/>
  
  <!-- Silver Star on Chest -->
  <polygon points="200,210 206,225 222,225 210,235 215,250 200,240 185,250 190,235 178,225 194,225" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#star-glow)"/>

  <!-- Front Right Arm holding bottle-cap shield -->
  <path d="M245 200 L285 220 L300 240" fill="none" stroke="url(#cap-blue)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="300" cy="240" r="7" fill="url(#leather)"/>

  <!-- Left Arm (pointing forward heroically) -->
  <path d="M155 200 L95 180 L65 195" fill="none" stroke="url(#cap-blue)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="65" cy="195" r="7" fill="url(#leather)"/>

  <!-- Giant Iconic Bottle Cap Shield held in foreground -->
  <g transform="translate(230, 180)">
    <!-- Serrated bottle cap outer rim -->
    <circle cx="65" cy="65" r="62" fill="#7f1d1d" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="65" cy="65" r="58" fill="url(#shield-red)"/>
    <circle cx="65" cy="65" r="46" fill="#f8fafc"/>
    <circle cx="65" cy="65" r="34" fill="url(#shield-red)"/>
    <circle cx="65" cy="65" r="22" fill="#1d4ed8"/>
    <!-- Shield Star -->
    <polygon points="65,47 69,57 80,57 72,64 75,74 65,68 55,74 58,64 50,57 61,57" fill="#ffffff" filter="url(#star-glow)"/>
    <!-- Shield Highlight Sheen -->
    <path d="M30 30 Q65 10 100 30 A58 58 0 0 0 30 30" fill="rgba(255,255,255,0.3)"/>
  </g>

  <!-- Captain Ant Helmet / Head -->
  <path d="M200 65 C155 65, 140 105, 145 155 C155 180, 180 190, 200 190 C220 190, 245 180, 255 155 C260 105, 245 65, 200 65 Z" fill="url(#cap-blue)" stroke="#0f172a" stroke-width="3"/>

  <!-- Winged Antennae (Heroic Winged Feathers) -->
  <g>
    <!-- Left Wing -->
    <path d="M145 105 Q120 70 95 80 Q110 95 125 105 Q100 100 90 115 Q110 120 135 120 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M170 85 C150 40, 115 45, 100 55" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
    <circle cx="100" cy="55" r="5" fill="#ffffff"/>
    
    <!-- Right Wing -->
    <path d="M255 105 Q280 70 305 80 Q290 95 275 105 Q300 100 310 115 Q290 120 265 120 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M230 85 C250 40, 285 45, 300 55" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
    <circle cx="300" cy="55" r="5" fill="#ffffff"/>
  </g>

  <!-- Letter 'A' (for Ant / Avengers) on forehead -->
  <text x="200" y="112" font-family="'Impact', 'Arial Black', sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle" stroke="#1e3a8a" stroke-width="1.5">A</text>

  <!-- Ant Eyes (Steely, determined, black obsidian compound eyes) -->
  <ellipse cx="175" cy="132" rx="14" ry="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <ellipse cx="225" cy="132" rx="14" ry="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <circle cx="178" cy="130" r="3" fill="#ffffff"/>
  <circle cx="228" cy="130" r="3" fill="#ffffff"/>

  <!-- Determined Mandibles / Chin Strap -->
  <path d="M170 160 C175 180, 190 185, 194 175" stroke="#94a3b8" stroke-width="3" fill="none"/>
  <path d="M230 160 C225 180, 210 185, 206 175" stroke="#94a3b8" stroke-width="3" fill="none"/>
  <!-- Helmet Chinstrap -->
  <path d="M152 145 Q200 185 248 145" fill="none" stroke="url(#leather)" stroke-width="4"/>
</svg>

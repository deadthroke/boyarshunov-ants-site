<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <radialGradient id="iron-glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iron-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="35%" stop-color="#b91c1c"/>
      <stop offset="85%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="iron-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="85%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <filter id="arc-glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient blue aura -->
  <circle cx="200" cy="220" r="180" fill="url(#iron-glow)"/>

  <!-- Repulsor Thruster Flames from legs -->
  <path d="M110 370 Q90 430 100 445 Q120 420 120 370" fill="#38bdf8" filter="url(#arc-glow-filter)"/>
  <path d="M290 370 Q310 430 300 445 Q280 420 280 370" fill="#38bdf8" filter="url(#arc-glow-filter)"/>
  <circle cx="105" cy="400" r="6" fill="#ffffff" filter="url(#arc-glow-filter)"/>
  <circle cx="295" cy="400" r="6" fill="#ffffff" filter="url(#arc-glow-filter)"/>

  <!-- Six Armored Mechanical Legs -->
  <!-- Upper Left Leg (aiming repulsor gauntlet) -->
  <path d="M140 190 L80 150 L50 170" fill="none" stroke="url(#iron-red)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="80" cy="150" r="8" fill="url(#iron-gold)"/>
  <!-- Gauntlet Palm Repulsor -->
  <circle cx="50" cy="170" r="12" fill="url(#iron-gold)"/>
  <circle cx="50" cy="170" r="7" fill="#ffffff" filter="url(#arc-glow-filter)"/>

  <!-- Upper Right Leg (aiming repulsor gauntlet) -->
  <path d="M260 190 L320 150 L350 170" fill="none" stroke="url(#iron-red)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="320" cy="150" r="8" fill="url(#iron-gold)"/>
  <circle cx="350" cy="170" r="12" fill="url(#iron-gold)"/>
  <circle cx="350" cy="170" r="7" fill="#ffffff" filter="url(#arc-glow-filter)"/>

  <!-- Mid Legs -->
  <path d="M140 230 L70 240 L50 280" fill="none" stroke="url(#iron-gold)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M260 230 L330 240 L350 280" fill="none" stroke="url(#iron-gold)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lower Legs / Flight Thrusters -->
  <path d="M150 280 L110 320 L110 370" fill="none" stroke="url(#iron-red)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="110" cy="320" r="7" fill="url(#iron-gold)"/>
  <path d="M250 280 L290 320 L290 370" fill="none" stroke="url(#iron-red)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="290" cy="320" r="7" fill="url(#iron-gold)"/>

  <!-- Ant Abdomen (Back Section) with Gold Plating -->
  <ellipse cx="200" cy="320" rx="55" ry="70" fill="url(#iron-red)" stroke="#450a0a" stroke-width="3"/>
  <path d="M170 300 Q200 330 230 300" stroke="url(#iron-gold)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M165 335 Q200 365 235 335" stroke="url(#iron-gold)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M175 370 Q200 390 225 370" stroke="url(#iron-gold)" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Ant Thorax (Center Armor + Arc Reactor) -->
  <ellipse cx="200" cy="225" rx="50" ry="55" fill="url(#iron-red)" stroke="#7f1d1d" stroke-width="3"/>
  <!-- Gold Shoulder & Chest Accents -->
  <path d="M155 185 L185 210 L165 240 Z" fill="url(#iron-gold)"/>
  <path d="M245 185 L215 210 L235 240 Z" fill="url(#iron-gold)"/>

  <!-- Arc Reactor Housing & Core -->
  <circle cx="200" cy="225" r="24" fill="#0f172a" stroke="url(#iron-gold)" stroke-width="3"/>
  <circle cx="200" cy="225" r="18" fill="#0284c7" filter="url(#arc-glow-filter)"/>
  <!-- Triangular Unibeam Core -->
  <polygon points="200,212 214,236 186,236" fill="#ffffff" filter="url(#arc-glow-filter)"/>

  <!-- Ant Neck Joint -->
  <rect x="188" y="155" width="24" height="20" rx="4" fill="#1e293b"/>

  <!-- Iron Ant Helmet (Head) -->
  <!-- Outer Red Helmet Dome -->
  <path d="M200 45 C150 45, 135 90, 140 145 C150 175, 180 185, 200 185 C220 185, 250 175, 260 145 C265 90, 250 45, 200 45 Z" fill="url(#iron-red)" stroke="#450a0a" stroke-width="3"/>

  <!-- High-Tech Antennae (Gold cyber-sensors) -->
  <path d="M165 70 C145 25, 110 30, 95 45" fill="none" stroke="url(#iron-gold)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="95" cy="45" r="6" fill="#38bdf8" filter="url(#arc-glow-filter)"/>
  
  <path d="M235 70 C255 25, 290 30, 305 45" fill="none" stroke="url(#iron-gold)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="305" cy="45" r="6" fill="#38bdf8" filter="url(#arc-glow-filter)"/>

  <!-- Faceplate (Signature Gold Mark Face) -->
  <path d="M160 85 C160 80, 240 80, 240 85 L235 140 L220 168 L180 168 L165 140 Z" fill="url(#iron-gold)" stroke="#713f12" stroke-width="2"/>
  <!-- Forehead line -->
  <line x1="180" y1="95" x2="220" y2="95" stroke="#713f12" stroke-width="2"/>

  <!-- Illuminated Eye Slits (Cyan Arc Glow) -->
  <polygon points="168,110 188,115 186,122 166,118" fill="#ffffff" filter="url(#arc-glow-filter)"/>
  <polygon points="232,110 212,115 214,122 234,118" fill="#ffffff" filter="url(#arc-glow-filter)"/>

  <!-- Micro-Mandibles / Micro-Thruster Vent Mouth -->
  <polygon points="188,148 212,148 206,162 194,162" fill="#0f172a"/>
  <!-- Gold Mandible pincers -->
  <path d="M174 150 C180 172, 192 178, 196 168" stroke="url(#iron-gold)" stroke-width="3" fill="none"/>
  <path d="M226 150 C220 172, 208 178, 204 168" stroke="url(#iron-gold)" stroke-width="3" fill="none"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <radialGradient id="widow-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stealth-black" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="red-sting-glow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="200" cy="220" r="180" fill="url(#widow-glow)"/>

  <!-- Legs - Agile, sleek black chitin with red joint bands -->
  <path d="M140 210 L65 160 L35 200" stroke="url(#stealth-black)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <circle cx="65" cy="160" r="4" fill="#ef4444"/>
  <path d="M260 210 L335 160 L365 200" stroke="url(#stealth-black)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <circle cx="335" cy="160" r="4" fill="#ef4444"/>

  <!-- Mid Legs -->
  <path d="M140 240 L70 260 L45 320" stroke="url(#stealth-black)" stroke-width="6.5" fill="none" stroke-linecap="round"/>
  <path d="M260 240 L330 260 L355 320" stroke="url(#stealth-black)" stroke-width="6.5" fill="none" stroke-linecap="round"/>

  <!-- Hind Legs -->
  <path d="M150 280 L90 350 L80 420" stroke="url(#stealth-black)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M250 280 L310 350 L320 420" stroke="url(#stealth-black)" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- Sleek Abdomen with Crimson Hourglass Symbol -->
  <ellipse cx="200" cy="335" rx="46" ry="65" fill="url(#stealth-black)" stroke="#020617" stroke-width="3"/>
  <!-- Red Hourglass Symbol -->
  <polygon points="186,305 214,305 200,328" fill="#ef4444" filter="url(#red-sting-glow)"/>
  <polygon points="186,351 214,351 200,328" fill="#ef4444" filter="url(#red-sting-glow)"/>

  <!-- Twin Electro-Baton Stingers held in claws -->
  <line x1="45" y1="180" x2="15" y2="240" stroke="#00f2fe" stroke-width="4" stroke-linecap="round" filter="url(#red-sting-glow)"/>
  <line x1="355" y1="180" x2="385" y2="240" stroke="#00f2fe" stroke-width="4" stroke-linecap="round" filter="url(#red-sting-glow)"/>

  <!-- Thorax with Tactical Vest Details -->
  <ellipse cx="200" cy="225" rx="42" ry="50" fill="url(#stealth-black)" stroke="#0f172a" stroke-width="2.5"/>
  <rect x="175" y="200" width="18" height="12" rx="2" fill="#334155"/>
  <rect x="207" y="200" width="18" height="12" rx="2" fill="#334155"/>
  <line x1="170" y1="240" x2="230" y2="240" stroke="#ef4444" stroke-width="2.5"/>

  <!-- Sleek Head / Mask with Fiery Red Compound Eyes -->
  <path d="M200 65 C160 65, 145 105, 150 155 C160 180, 180 188, 200 188 C220 188, 240 180, 250 155 C255 105, 240 65, 200 65 Z" fill="url(#stealth-black)" stroke="#020617" stroke-width="3"/>

  <!-- Antennae (graceful stealth sensors) -->
  <path d="M170 70 C150 25, 120 30, 105 45" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M230 70 C250 25, 280 30, 295 45" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Fiery Red Spider/Ant Eyes -->
  <ellipse cx="175" cy="125" rx="12" ry="8" fill="#ef4444" filter="url(#red-sting-glow)"/>
  <ellipse cx="225" cy="125" rx="12" ry="8" fill="#ef4444" filter="url(#red-sting-glow)"/>
  <circle cx="175" cy="125" r="2.5" fill="#ffffff"/>
  <circle cx="225" cy="125" r="2.5" fill="#ffffff"/>

  <!-- Stealth Mandibles with Electric Venom -->
  <path d="M176 155 C180 178, 192 182, 196 172" stroke="#cbd5e1" stroke-width="2.5" fill="none"/>
  <path d="M224 155 C220 178, 208 182, 204 172" stroke="#cbd5e1" stroke-width="2.5" fill="none"/>
</svg>

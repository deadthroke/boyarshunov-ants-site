<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <radialGradient id="thor-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="thor-cape" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="60%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="asgard-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="lightning-fx">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="200" cy="220" r="180" fill="url(#thor-glow)"/>

  <!-- Dramatic Lightning Bolts in Background -->
  <path d="M50 80 L90 150 L75 165 L120 220" stroke="#38bdf8" stroke-width="3" fill="none" filter="url(#lightning-fx)"/>
  <path d="M350 70 L310 140 L325 155 L280 210" stroke="#38bdf8" stroke-width="3" fill="none" filter="url(#lightning-fx)"/>

  <!-- Red Heroic Petal Cape -->
  <path d="M140 180 C90 220, 60 320, 75 420 C120 400, 160 410, 200 420 C240 410, 280 400, 325 420 C340 320, 310 220, 260 180 Z" fill="url(#thor-cape)" stroke="#450a0a" stroke-width="3"/>

  <!-- Legs -->
  <path d="M140 310 L90 360 L80 415" fill="none" stroke="url(#asgard-silver)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M260 310 L310 360 L320 415" fill="none" stroke="url(#asgard-silver)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M140 240 L80 260 L60 310" fill="none" stroke="url(#asgard-silver)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M260 240 L320 260 L340 310" fill="none" stroke="url(#asgard-silver)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Ant Thorax (Armored with 6 Silver Discs) -->
  <ellipse cx="200" cy="235" rx="48" ry="55" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
  <!-- Silver Discs on Chestplate -->
  <circle cx="180" cy="210" r="12" fill="url(#asgard-silver)" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="220" cy="210" r="12" fill="url(#asgard-silver)" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="175" cy="240" r="12" fill="url(#asgard-silver)" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="225" cy="240" r="12" fill="url(#asgard-silver)" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="185" cy="268" r="10" fill="url(#asgard-silver)" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="215" cy="268" r="10" fill="url(#asgard-silver)" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Right Arm raising Mjölnir screw to the heavens -->
  <path d="M250 200 L290 160 L310 110" fill="none" stroke="url(#asgard-silver)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Sacred Mjölnir (Watch Screw on Toothpick) with Lightning Surge -->
  <g transform="translate(290, 45) rotate(15)">
    <!-- Lightning crackle around screw -->
    <path d="M-15 10 L-30 0 L-20 -15 L-40 -25" stroke="#bae6fd" stroke-width="3" fill="none" filter="url(#lightning-fx)"/>
    <path d="M45 10 L60 -5 L50 -20 L70 -35" stroke="#bae6fd" stroke-width="3" fill="none" filter="url(#lightning-fx)"/>
    <!-- Handle -->
    <rect x="12" y="25" width="8" height="45" rx="2" fill="#92400e" stroke="#451a03" stroke-width="1.5"/>
    <line x1="12" y1="35" x2="20" y2="35" stroke="#fef08a" stroke-width="1.5"/>
    <line x1="12" y1="45" x2="20" y2="45" stroke="#fef08a" stroke-width="1.5"/>
    <line x1="12" y1="55" x2="20" y2="55" stroke="#fef08a" stroke-width="1.5"/>
    <!-- Heavy Hex Nut Head -->
    <rect x="-8" y="0" width="48" height="28" rx="3" fill="url(#asgard-silver)" stroke="#0f172a" stroke-width="2"/>
    <rect x="4" y="11" width="24" height="6" fill="#0f172a" rx="1"/>
    <circle cx="16" cy="14" r="3" fill="#38bdf8" filter="url(#lightning-fx)"/>
  </g>

  <!-- Left Arm (clenched fist crackling with static) -->
  <path d="M150 200 L95 210 L70 230" fill="none" stroke="url(#asgard-silver)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="70" cy="230" r="9" fill="#0f172a"/>
  <circle cx="70" cy="230" r="5" fill="#38bdf8" filter="url(#lightning-fx)"/>

  <!-- Thor Winged Asgardian Helmet -->
  <path d="M200 65 C150 65, 140 105, 145 155 C155 180, 180 190, 200 190 C220 190, 245 180, 255 155 C260 105, 250 65, 200 65 Z" fill="url(#asgard-silver)" stroke="#0f172a" stroke-width="3"/>

  <!-- Silver Wings on Helmet -->
  <path d="M145 90 Q105 40 80 50 Q100 80 115 100 Q85 90 75 110 Q105 120 135 125 Z" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <path d="M255 90 Q295 40 320 50 Q300 80 285 100 Q315 90 325 110 Q295 120 265 125 Z" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>

  <!-- Golden Blonde Antennae Locks -->
  <path d="M165 70 C145 20, 110 25, 95 38" fill="none" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="95" cy="38" r="5" fill="#fbbf24"/>
  <path d="M235 70 C255 20, 290 25, 305 38" fill="none" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="305" cy="38" r="5" fill="#fbbf24"/>

  <!-- Lightning Eyes -->
  <polygon points="168,122 188,126 185,134 165,130" fill="#38bdf8" filter="url(#lightning-fx)"/>
  <polygon points="232,122 212,126 215,134 235,130" fill="#38bdf8" filter="url(#lightning-fx)"/>

  <!-- Norse Beard on Mandibles -->
  <path d="M172 152 C180 185, 200 190, 200 190 C200 190, 220 185, 228 152 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
</svg>

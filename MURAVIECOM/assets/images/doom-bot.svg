<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <radialGradient id="bot-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="40%" stop-color="#64748b"/>
      <stop offset="80%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="green-flare">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="200" cy="220" r="180" fill="url(#bot-glow)"/>

  <!-- Mechanical cyber-legs with pistons -->
  <path d="M140 220 L60 170 L30 220" stroke="url(#chrome)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M260 220 L340 170 L370 220" stroke="url(#chrome)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M140 250 L50 270 L30 330" stroke="url(#chrome)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M260 250 L350 270 L370 330" stroke="url(#chrome)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M150 290 L80 360 L70 420" stroke="url(#chrome)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M250 290 L320 360 L330 420" stroke="url(#chrome)" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Aphid Abdomen (Pressurized Acid Container) -->
  <ellipse cx="200" cy="330" rx="55" ry="68" fill="#15803d" stroke="#052e16" stroke-width="3"/>
  <!-- Glass Chamber with glowing toxic bio-acid -->
  <ellipse cx="200" cy="340" rx="36" ry="45" fill="#22c55e" filter="url(#green-flare)" opacity="0.8"/>
  <path d="M175 310 Q200 330 225 310" stroke="#f0fdf4" stroke-width="3" fill="none"/>
  <!-- Acid level lines -->
  <line x1="170" y1="350" x2="230" y2="350" stroke="#052e16" stroke-width="2"/>
  <line x1="175" y1="365" x2="225" y2="365" stroke="#052e16" stroke-width="2"/>

  <!-- Metal Segment Bands -->
  <path d="M150 280 Q200 300 250 280" stroke="url(#chrome)" stroke-width="6" fill="none"/>

  <!-- Robot Thorax -->
  <ellipse cx="200" cy="225" rx="46" ry="50" fill="url(#chrome)" stroke="#0f172a" stroke-width="3"/>
  <!-- Doom Insignia / Serial Number -->
  <rect x="180" y="210" width="40" height="24" rx="3" fill="#0f172a"/>
  <text x="200" y="226" font-family="monospace" font-size="12" font-weight="bold" fill="#22c55e" text-anchor="middle">DM-07</text>

  <!-- Robot Ant Head -->
  <polygon points="150,90 250,90 235,175 165,175" fill="url(#chrome)" stroke="#0f172a" stroke-width="3"/>
  <!-- Exposed wire / antennae with transmitter dishes -->
  <line x1="170" y1="90" x2="135" y2="40" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="135" cy="40" r="8" fill="#22c55e" filter="url(#green-flare)"/>
  <line x1="230" y1="90" x2="265" y2="40" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="265" cy="40" r="8" fill="#22c55e" filter="url(#green-flare)"/>

  <!-- Cyclops / Multi-sensor Visor (Menacing Doom Green Glow) -->
  <rect x="165" y="115" width="70" height="18" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <rect x="170" y="118" width="60" height="12" rx="2" fill="#22c55e" filter="url(#green-flare)"/>

  <!-- Serrated Steel Mandible Saws -->
  <polygon points="160,165 140,200 165,190 150,215 175,195 180,175" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
  <polygon points="240,165 260,200 235,190 250,215 225,195 220,175" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <radialGradient id="hulk-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#16a34a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gamma-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="35%" stop-color="#22c55e"/>
      <stop offset="75%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="purple-pants" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
  </defs>

  <circle cx="200" cy="220" r="190" fill="url(#hulk-glow)"/>

  <!-- Cracked Ground from heavy ant feet -->
  <path d="M120 425 L100 440 M140 430 L160 445 M260 430 L240 445 M280 425 L300 440" stroke="#86efac" stroke-width="2.5"/>

  <!-- Huge Muscular Legs (Behind) -->
  <path d="M130 310 L70 360 L60 425" fill="none" stroke="url(#gamma-green)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M270 310 L330 360 L340 425" fill="none" stroke="url(#gamma-green)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Middle Legs -->
  <path d="M120 230 L50 250 L30 310" fill="none" stroke="url(#gamma-green)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M280 230 L350 250 L370 310" fill="none" stroke="url(#gamma-green)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Massive Abdomen in Ripped Purple Petal Shorts -->
  <ellipse cx="200" cy="350" rx="65" ry="75" fill="url(#purple-pants)" stroke="#3b0764" stroke-width="3"/>
  <!-- Ripped hems of petal shorts -->
  <path d="M135 370 L145 385 L155 372 L170 390 L185 374 L200 392 L215 374 L230 390 L245 372 L255 385 L265 370" fill="none" stroke="#a855f7" stroke-width="3"/>

  <!-- Colossal Thorax with Hulk Muscles -->
  <ellipse cx="200" cy="220" rx="70" ry="70" fill="url(#gamma-green)" stroke="#052e16" stroke-width="4"/>
  <!-- Pecs and Abs definition -->
  <path d="M145 180 Q170 215 200 215 Q230 215 255 180" stroke="#052e16" stroke-width="4" fill="none"/>
  <line x1="200" y1="180" x2="200" y2="280" stroke="#052e16" stroke-width="3.5"/>
  <path d="M165 240 Q180 250 200 250 Q220 250 235 240" stroke="#052e16" stroke-width="3" fill="none"/>
  <path d="M170 270 Q185 278 200 278 Q215 278 230 270" stroke="#052e16" stroke-width="3" fill="none"/>

  <!-- Pulsing Gamma Veins -->
  <path d="M150 205 Q165 195 180 205" stroke="#86efac" stroke-width="2.5" fill="none"/>
  <path d="M250 205 Q235 195 220 205" stroke="#86efac" stroke-width="2.5" fill="none"/>

  <!-- Colossal Clenched Front Bicep Claws -->
  <path d="M140 180 L75 160 L55 120" fill="none" stroke="url(#gamma-green)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="55" cy="120" r="16" fill="url(#gamma-green)" stroke="#052e16" stroke-width="3"/>

  <path d="M260 180 L325 160 L345 120" fill="none" stroke="url(#gamma-green)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="345" cy="120" r="16" fill="url(#gamma-green)" stroke="#052e16" stroke-width="3"/>

  <!-- Hulk Ant Head (Brutish, thick jaw, furious) -->
  <path d="M200 65 C140 65, 125 105, 130 160 C140 190, 170 200, 200 200 C230 200, 260 190, 270 160 C275 105, 260 65, 200 65 Z" fill="url(#gamma-green)" stroke="#052e16" stroke-width="4"/>

  <!-- Thick Ragged Antennae -->
  <path d="M165 70 C140 30, 110 35, 90 45" fill="none" stroke="#15803d" stroke-width="7" stroke-linecap="round"/>
  <circle cx="90" cy="45" r="7" fill="#4ade80"/>
  <path d="M235 70 C260 30, 290 35, 310 45" fill="none" stroke="#15803d" stroke-width="7" stroke-linecap="round"/>
  <circle cx="310" cy="45" r="7" fill="#4ade80"/>

  <!-- Heavy Brow Ridge -->
  <path d="M150 115 L200 125 L250 115" stroke="#052e16" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Glowing Pure Gamma White-Green Eyes -->
  <polygon points="160,125 185,130 180,140 155,135" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <polygon points="240,125 215,130 220,140 245,135" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>

  <!-- Gigantic Roaring Mandibles with Sharp Teeth -->
  <path d="M150 155 C155 200, 185 215, 192 195 C178 185, 168 170, 150 155 Z" fill="#f8fafc" stroke="#052e16" stroke-width="3"/>
  <path d="M250 155 C245 200, 215 215, 208 195 C222 185, 232 170, 250 155 Z" fill="#f8fafc" stroke="#052e16" stroke-width="3"/>
  <!-- Roaring Open Maw Interior -->
  <ellipse cx="200" cy="180" rx="16" ry="12" fill="#052e16"/>
</svg>

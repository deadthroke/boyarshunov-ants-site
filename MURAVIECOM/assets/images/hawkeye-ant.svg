<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <radialGradient id="hawk-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hawk-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="40%" stop-color="#9333ea"/>
      <stop offset="85%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <filter id="purple-laser">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="200" cy="220" r="180" fill="url(#hawk-glow)"/>

  <!-- Back Legs -->
  <path d="M150 290 L90 350 L80 420" stroke="url(#hawk-purple)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M250 290 L310 350 L320 420" stroke="url(#hawk-purple)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- Mid Legs -->
  <path d="M140 240 L70 260 L50 310" stroke="url(#hawk-purple)" stroke-width="6.5" fill="none" stroke-linecap="round"/>
  <path d="M260 240 L330 260 L350 310" stroke="url(#hawk-purple)" stroke-width="6.5" fill="none" stroke-linecap="round"/>

  <!-- Abdomen with Quiver of Rose Thorns -->
  <ellipse cx="200" cy="335" rx="46" ry="65" fill="url(#hawk-purple)" stroke="#1e1b4b" stroke-width="3"/>

  <!-- Quiver on back with venomous thorn arrows -->
  <g transform="translate(230, 260) rotate(20)">
    <rect x="0" y="0" width="22" height="70" rx="4" fill="#581c87" stroke="#3b0764" stroke-width="2"/>
    <!-- Thorns sticking out -->
    <path d="M6 0 L4 -25 L8 0" fill="#22c55e" stroke="#14532d"/>
    <path d="M11 0 L11 -30 L15 0" fill="#ec4899" stroke="#9d174d"/>
    <path d="M16 0 L18 -22 L20 0" fill="#22c55e" stroke="#14532d"/>
  </g>

  <!-- Thorax with Archery Harness -->
  <ellipse cx="200" cy="225" rx="44" ry="50" fill="url(#hawk-purple)" stroke="#1e1b4b" stroke-width="3"/>
  <path d="M165 195 L235 255" stroke="#3b0764" stroke-width="5"/>
  <path d="M235 195 L165 255" stroke="#3b0764" stroke-width="5"/>
  <!-- Target Reticle on Chest -->
  <circle cx="200" cy="225" r="10" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="200" cy="225" r="4" fill="#f59e0b"/>

  <!-- Drawing the Micro-Bow (Pine Needle + Spider Silk) -->
  <!-- Left Arm holding the bow stave -->
  <path d="M150 190 L90 170 L50 160" stroke="url(#hawk-purple)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- The Bow (Curved pine needle) -->
  <path d="M40 80 Q75 160 40 240" fill="none" stroke="#15803d" stroke-width="5" stroke-linecap="round"/>
  <!-- Spider Silk String (Drawn back) -->
  <path d="M40 80 L130 160 L40 240" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Right Arm pulling the string -->
  <path d="M240 190 L180 180 L130 160" stroke="url(#hawk-purple)" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Rose Thorn Arrow aimed forward -->
  <line x1="45" y1="160" x2="160" y2="160" stroke="#a855f7" stroke-width="3" filter="url(#purple-laser)"/>
  <polygon points="35,160 48,155 48,165" fill="#f43f5e" filter="url(#purple-laser)"/>

  <!-- Head with Hawkeye Tactical Mask -->
  <path d="M200 65 C160 65, 145 105, 150 155 C160 180, 180 188, 200 188 C220 188, 240 180, 250 155 C255 105, 240 65, 200 65 Z" fill="url(#hawk-purple)" stroke="#1e1b4b" stroke-width="3"/>
  
  <!-- Mask Wing Motifs over Eyes -->
  <path d="M160 110 L195 125 L185 140 L150 125 Z" fill="#581c87"/>
  <path d="M240 110 L205 125 L215 140 L250 125 Z" fill="#581c87"/>

  <!-- High-precision Purple Compound Eyes -->
  <ellipse cx="175" cy="125" rx="10" ry="7" fill="#c084fc" filter="url(#purple-laser)"/>
  <ellipse cx="225" cy="125" rx="10" ry="7" fill="#c084fc" filter="url(#purple-laser)"/>
  <circle cx="175" cy="125" r="2.5" fill="#ffffff"/>
  <circle cx="225" cy="125" r="2.5" fill="#ffffff"/>

  <!-- Antennae (Sharpshooter Wind-detectors) -->
  <path d="M170 70 C150 25, 120 30, 105 40" fill="none" stroke="#c084fc" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M230 70 C250 25, 280 30, 295 40" fill="none" stroke="#c084fc" stroke-width="3.5" stroke-linecap="round"/>
</svg>

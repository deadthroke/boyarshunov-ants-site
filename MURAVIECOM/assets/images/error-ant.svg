<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <radialGradient id="err-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dirt-cliff" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#291203"/>
      <stop offset="100%" stop-color="#140701"/>
    </linearGradient>
    <filter id="err-shadow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="500" height="400" rx="12" fill="#0b1120"/>
  <circle cx="250" cy="200" r="180" fill="url(#err-glow)"/>

  <!-- Collapsed Tunnel Entrance (Dark cavity in earth) -->
  <path d="M70 380 Q90 120 250 120 Q410 120 430 380 Z" fill="#020617" stroke="#1e293b" stroke-width="4"/>

  <!-- Crumbled Earth & Rock Debris Pile -->
  <path d="M110 380 L140 260 L180 300 L230 240 L280 290 L340 250 L380 380 Z" fill="url(#dirt-cliff)" stroke="#000000" stroke-width="3"/>
  <!-- Fallen Rocks / Boulders -->
  <circle cx="160" cy="330" r="26" fill="#334155" stroke="#0f172a" stroke-width="2.5"/>
  <circle cx="210" cy="310" r="32" fill="#475569" stroke="#0f172a" stroke-width="2.5"/>
  <circle cx="270" cy="335" r="28" fill="#334155" stroke="#0f172a" stroke-width="2.5"/>
  <circle cx="330" cy="320" r="22" fill="#475569" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Broken Sugar Crystal in Rubble -->
  <g transform="translate(180, 230) rotate(-20) scale(0.65)">
    <polygon points="40,10 70,25 40,40 10,25" fill="#bae6fd" stroke="#ffffff"/>
    <polygon points="10,25 40,40 40,75 10,60" fill="#38bdf8"/>
    <polygon points="40,40 70,25 70,60 40,75" fill="#0284c7"/>
    <!-- Crack through crystal -->
    <path d="M30 15 L45 45 L35 70" stroke="#ef4444" stroke-width="3" fill="none"/>
  </g>

  <!-- Hazard / Caution Tape Across Tunnel -->
  <g transform="rotate(-7 250 180)">
    <rect x="50" y="170" width="400" height="24" fill="#facc15" stroke="#000000" stroke-width="2.5"/>
    <!-- Hazard Stripes -->
    <polygon points="60,170 80,170 65,194 45,194" fill="#000000"/>
    <polygon points="100,170 120,170 105,194 85,194" fill="#000000"/>
    <polygon points="140,170 160,170 145,194 125,194" fill="#000000"/>
    <polygon points="180,170 200,170 185,194 165,194" fill="#000000"/>
    <polygon points="220,170 240,170 225,194 205,194" fill="#000000"/>
    <polygon points="260,170 280,170 265,194 245,194" fill="#000000"/>
    <polygon points="300,170 320,170 305,194 285,194" fill="#000000"/>
    <polygon points="340,170 360,170 345,194 325,194" fill="#000000"/>
    <polygon points="380,170 400,170 385,194 365,194" fill="#000000"/>
    <polygon points="420,170 440,170 425,194 405,194" fill="#000000"/>
    <text x="250" y="187" font-family="'Russo One', Impact, sans-serif" font-size="12" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="3">ОБВАЛ ТУННЕЛЯ • 404</text>
  </g>

  <!-- Confused Worker Ant with Blueprint and Hard Hat -->
  <g transform="translate(230, 240)">
    <!-- Body -->
    <ellipse cx="60" cy="90" rx="22" ry="28" fill="#1e3a8a" stroke="#000" stroke-width="2"/>
    <ellipse cx="60" cy="45" rx="18" ry="20" fill="#1e3a8a" stroke="#000" stroke-width="2"/>
    
    <!-- Yellow Hard Hat -->
    <path d="M42 35 C42 20, 78 20, 78 35 Z" fill="#facc15" stroke="#000" stroke-width="2"/>
    <rect x="38" y="33" width="44" height="6" rx="2" fill="#eab308" stroke="#000" stroke-width="1.5"/>

    <!-- Antennae bent into question marks -->
    <path d="M52 20 Q40 0 35 10 Q32 18 42 24" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="43" cy="28" r="2" fill="#38bdf8"/>

    <path d="M68 20 Q80 0 85 10 Q88 18 78 24" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="77" cy="28" r="2" fill="#38bdf8"/>

    <!-- Big Worried Compound Eyes -->
    <ellipse cx="52" cy="42" rx="6" ry="8" fill="#0f172a"/>
    <circle cx="53" cy="40" r="2.5" fill="#ffffff"/>
    <ellipse cx="68" cy="42" rx="6" ry="8" fill="#0f172a"/>
    <circle cx="69" cy="40" r="2.5" fill="#ffffff"/>

    <!-- Claws holding upside-down Blueprint map -->
    <!-- Blueprint Leaf / Scroll -->
    <g transform="translate(15, 65) rotate(15)">
      <rect x="0" y="0" width="50" height="36" rx="2" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="8" y1="8" x2="42" y2="8" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2 2"/>
      <line x1="8" y1="16" x2="30" y2="16" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="8" y1="24" x2="40" y2="24" stroke="#ffffff" stroke-width="1.5"/>
      <!-- Red Cross on map -->
      <line x1="26" y1="12" x2="36" y2="22" stroke="#ef4444" stroke-width="2.5"/>
      <line x1="36" y1="12" x2="26" y2="22" stroke="#ef4444" stroke-width="2.5"/>
    </g>

    <!-- Question Mark Popups -->
    <text x="0" y="20" font-family="'Russo One', sans-serif" font-size="28" font-weight="900" fill="#facc15" stroke="#000" stroke-width="1.5">?</text>
    <text x="105" y="25" font-family="'Russo One', sans-serif" font-size="24" font-weight="900" fill="#facc15" stroke="#000" stroke-width="1.5">?!</text>
  </g>

  <!-- Giant 404 in Comic 3D Letters -->
  <g transform="translate(250, 75)">
    <!-- Comic sound starburst behind 404 -->
    <polygon points="0,-45 20,-25 50,-35 40,-10 65,5 38,18 45,45 18,32 0,55 -18,32 -45,45 -38,18 -65,5 -40,-10 -50,-35 -20,-25" fill="#dc2626" stroke="#000000" stroke-width="3" transform="scale(2.2)"/>
    <text x="0" y="22" font-family="'Russo One', 'Impact', sans-serif" font-size="76" font-weight="900" fill="#ffffff" text-anchor="middle" stroke="#000000" stroke-width="6" letter-spacing="4">404</text>
    <text x="0" y="22" font-family="'Russo One', 'Impact', sans-serif" font-size="76" font-weight="900" fill="#facc15" text-anchor="middle" letter-spacing="4">404</text>
  </g>
</svg>
